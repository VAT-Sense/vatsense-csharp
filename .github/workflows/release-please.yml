# Keeps a release pull request open with the next version and changelog.
# Merging that pull request tags the release and publishes the package.
# This replaces the release pull requests the Stainless app used to open.
name: Release Please
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: release please
    runs-on: ubuntu-latest
    if: github.repository == 'VAT-Sense/vatsense-csharp'

    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release made with the workflow's own token does not start other
      # workflows, so the publish workflow is started here instead.
      - name: Publish the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-nuget.yml --repo ${{ github.repository }} --ref ${{ steps.release.outputs.tag_name }}
